name: Temporary Wave 3 control close-out

on:
  push:
    branches:
      - docs/digital-library-wave-3-closeout

permissions:
  contents: write

jobs:
  patch-control-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/digital-library-wave-3-closeout
          fetch-depth: 0

      - name: Patch control records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hp = Path('projects/kalaignar-digital-library/HANDOVER.md')
          np = Path('projects/kalaignar-digital-library/NEXT_CHAT_PROMPT.md')
          h = hp.read_text()
          n = np.read_text()

          hc = Path('.wave3-closeout/handover-current.md').read_text()
          pb = Path('.wave3-closeout/phase-bullet.md').read_text()
          ws = Path('.wave3-closeout/wave3-section.md').read_text()
          nc = Path('.wave3-closeout/next-current.md').read_text()

          old_h = '### Verified live state — 2026-09-02, post-Wave-2 ✅ CURRENT'
          assert h.count(old_h) == 1, h.count(old_h)
          h = h.replace(old_h, hc + '### Verified live state — 2026-09-02, post-Wave-2 ⚠️ SUPERSEDED (kept as history)', 1)

          sep = '\n---\n\n## Bulk Onboarding Wave 2 — Fiction / 1977 short-story anthology — ✅ COMPLETE and CLOSED'
          assert h.count(sep) == 1, h.count(sep)
          h = h.replace(sep, '\n' + pb + '\n---\n\n## Bulk Onboarding Wave 2 — Fiction / 1977 short-story anthology — ✅ COMPLETE and CLOSED', 1)

          wave2 = '## Bulk Onboarding Wave 2 — Fiction / 1977 short-story anthology — ✅ COMPLETE and CLOSED'
          assert h.count(wave2) == 1, h.count(wave2)
          h = h.replace(wave2, ws + wave2, 1)

          old_n = '## ⚠️ CURRENT STATE — 2026-09-02, post-Wave-2 (supersedes the phase list below)'
          assert n.count(old_n) == 1, n.count(old_n)
          n = n.replace(old_n, nc + '## ⚠️ CURRENT STATE — 2026-09-02, post-Wave-2 ⚠️ SUPERSEDED (kept as history)', 1)

          hp.write_text(h)
          np.write_text(n)
          PY

          git diff --check

      - name: Commit control-only close-out
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .wave3-closeout .github/workflows/tmp-wave3-control-closeout.yml
          git add projects/kalaignar-digital-library/HANDOVER.md projects/kalaignar-digital-library/NEXT_CHAT_PROMPT.md
          git commit -m "docs(digital-library): close Bulk Onboarding Wave 3 Essays"
          git push origin HEAD:docs/digital-library-wave-3-closeout
